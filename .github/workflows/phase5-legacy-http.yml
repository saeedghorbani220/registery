name: phase5-legacy-http

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase5-legacy-http.yml'
      - 'lab/scripts/patch_phase5_legacy_http.py'
      - 'lab/scripts/patch_phase5_host_api_ci.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: irica_ci_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IRICA_DB_ROOT_PASSWORD: irica_ci_root
      IRICA_DB_HOST: 127.0.0.1
      IRICA_DB_PORT: '3307'
      IRICA_TEST_DB_ACCOUNT_HOST: '%'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql php-mbstring
          echo "IRICA_MARIADB=$(command -v mariadb)" >> "$GITHUB_ENV"
          echo "IRICA_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Apply guarded legacy HTTP patch
        run: |
          python lab/scripts/patch_phase5_legacy_http.py
          python lab/scripts/patch_phase5_host_api_ci.py
      - name: Verify legacy service and real HTTP boundary
        run: >-
          python lab/scripts/run_panel_tests.py
          test_server_crm_v2_legacy_import
          test_server_crm_v2_legacy_apply
          test_host_api
      - name: Lint host PHP
        run: find host -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/config/config.example.php host/public/index.php lab/tests/test_host_api.py
          git diff --cached --check
          git commit -m "feat(migration): expose guarded legacy migration API"
          git push origin HEAD:feat/server-crm-v2-work
