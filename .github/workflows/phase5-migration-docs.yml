name: phase5-migration-docs

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase5-migration-docs.yml'
      - 'lab/scripts/patch_phase5_migration_docs.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and verify documentation patch
        run: python lab/scripts/patch_phase5_migration_docs.py
      - name: Check documentation diff
        run: |
          git diff --check
          grep -q "## 9.5. Migrate a legacy local CRM database" host/INSTALL.md
          grep -q "A shared username is supported" host/INSTALL.md
          grep -q "self-enrol" host/INSTALL.md
          grep -q "bootstrap + legacy migration analyze" host/config/config.example.php
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/INSTALL.md host/config/config.example.php
          git diff --cached --check
          git commit -m "docs(host): document multi-device and legacy migration rollout"
          git push origin HEAD:feat/server-crm-v2-work
