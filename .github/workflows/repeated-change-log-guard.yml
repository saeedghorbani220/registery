name: repeated-change-log-guard

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/repeated-change-log-guard.yml'
      - 'lab/scripts/patch_cloud_repeated_changes.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Apply repeated change-log patch
        run: python lab/scripts/patch_cloud_repeated_changes.py
      - name: Verify apply parser and end-to-end conflict flow
        run: >-
          python lab/scripts/run_panel_tests.py
          test_cloud_apply
          test_cloud_integration
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_sync/apply.py lab/tests/test_cloud_apply.py
          git diff --cached --check
          git commit -m "fix(sync): accept repeated current row snapshots"
          git push origin HEAD:feat/server-crm-v2-work
