name: phase7-migration-reconciliation

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase7-migration-reconciliation.yml'
      - 'lab/scripts/patch_phase7_migration_reconciliation.py'
      - 'lab/scripts/patch_phase7_migration_reconciliation_v2.py'
      - 'lab/scripts/patch_phase7_transaction_order_v3.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: irica_ci_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IRICA_DB_ROOT_PASSWORD: irica_ci_root
      IRICA_DB_HOST: 127.0.0.1
      IRICA_DB_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MariaDB client and PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql
          echo "IRICA_MARIADB=$(command -v mariadb)" >> "$GITHUB_ENV"
          echo "IRICA_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Apply Phase 7 reconciliation and ordering patch
        run: python lab/scripts/patch_phase7_transaction_order_v3.py
      - name: Verify reviewed migration reconciliation on real MariaDB
        run: python lab/scripts/run_panel_tests.py test_server_crm_v2_legacy_apply
      - name: Lint changed PHP
        run: php -l host/src/LegacyApply.php
      - name: Commit verified production fix and reconciliation test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/src/LegacyApply.php lab/tests/test_server_crm_v2_legacy_apply.py
          git diff --cached --check
          git commit -m "fix(migration): preserve legacy ledger order"
          git push origin HEAD:feat/server-crm-v2-work
