name: phase3-authority-apply

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase3-apply.yml'
      - 'lab/scripts/apply_server_crm_v2_phase3.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Apply guarded phase 3 patch
        run: python lab/scripts/apply_server_crm_v2_phase3.py
      - name: Verify phase 3 and focused cloud regressions
        run: >-
          python lab/scripts/run_panel_tests.py
          test_server_crm_v2_authority
          test_cloud_transport
          test_cloud_apply
          test_cloud_online_mode_and_backup
      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_sync/state.py cloud_sync/errors.py cloud_sync/client.py panel.py lab/tests/test_cloud_transport.py lab/tests/test_server_crm_v2_authority.py
          git diff --cached --check
          git commit -m "feat(sync): gate mutations on durable bootstrap authority"
          git push origin HEAD:feat/server-crm-v2-work
