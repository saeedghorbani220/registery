name: apply-phase3-test-fixtures

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - 'lab/scripts/patch_phase3_test_fixtures.py'
      - '.github/workflows/apply-phase3-test-fixtures.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Apply test-only fixture migration
        run: python lab/scripts/patch_phase3_test_fixtures.py
      - name: Verify migrated authority fixtures
        run: >-
          python lab/scripts/run_panel_tests.py
          test_cloud_conflicts
          test_cloud_integration
          test_server_crm_v2_authority
      - name: Commit migrated fixtures
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/tests/test_cloud_conflicts.py lab/tests/test_cloud_integration.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "test(sync): migrate fixtures to authority bootstrap"
            git push origin HEAD:feat/server-crm-v2-work
          }
