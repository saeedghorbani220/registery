name: v115-cloud-route-guard-fix

on:
  push:
    branches:
      - work/v115-finalize-phases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cloud UI verifier dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Align presence routes with existing guarded response pattern
        shell: python
        run: |
          from pathlib import Path
          p = Path('panel.py')
          s = p.read_text(encoding='utf-8')

          def replace_route(source, header, next_header, replacement):
              start = source.find(header)
              if start < 0:
                  raise SystemExit('missing route header: ' + header.strip())
              end = source.find(next_header, start + len(header))
              if end < 0:
                  raise SystemExit('missing next route header: ' + next_header.strip())
              block = source[start:end]
              if replacement == block:
                  return source
              if '_cloud_route_guard(' not in block:
                  raise SystemExit('route is no longer guarded: ' + header.strip())
              return source[:start] + replacement + source[end:]

          s = replace_route(
              s,
              '        elif self.path == "/cloud-presence":\n',
              '        elif self.path == "/cloud-presence-close":\n',
              '        elif self.path == "/cloud-presence":\n'
              '            resp, status = _cloud_route_guard(cloud_presence_heartbeat,\n'
              '                                                self._read_json())\n'
              '            self._json(resp, status)\n'
          )
          s = replace_route(
              s,
              '        elif self.path == "/cloud-presence-close":\n',
              '        elif self.path == "/cloud-resolve-conflict":\n',
              '        elif self.path == "/cloud-presence-close":\n'
              '            resp, status = _cloud_route_guard(cloud_presence_close,\n'
              '                                                self._read_json())\n'
              '            self._json(resp, status)\n'
          )
          p.write_text(s, encoding='utf-8')
      - name: Verify cloud UI and presence contracts
        run: >-
          python lab/scripts/run_panel_tests.py
          test_cloud_ui
          test_server_crm_v2_presence_client
          test_server_crm_v2_release_gate
      - name: Commit product fix only
        shell: bash
        run: |
          git config user.name "saeedghorbani220"
          git config user.email "saeedghorbani220@gmail.com"
          git add panel.py
          if git diff --cached --quiet; then
            echo "No product change needed"
          else
            git commit -m "fix: keep presence routes inside guarded cloud contract"
            git push origin HEAD:work/v115-finalize-phases
          fi
