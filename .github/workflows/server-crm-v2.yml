name: server-crm-v2

on:
  push:
    branches:
      - main
      - 'feat/server-crm-v2-work'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloud-client:
    # The shipped secret store is Windows DPAPI + Windows ACLs by design.
    # Running credential-flow tests on Linux would correctly fail closed and
    # would not represent the production desktop environment.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run cloud client tests on the production OS family
        run: >-
          python lab/scripts/run_panel_tests.py
          test_cloud_state
          test_cloud_transport
          test_cloud_apply
          test_cloud_import
          test_cloud_ui
          test_cloud_conflicts
          test_cloud_integration
          test_cloud_online_mode_and_backup
          test_server_crm_v2_client_devices
          test_server_crm_v2_authority
          test_server_crm_v2_finance_outbox
          test_server_crm_v2_finance_transport
          test_server_crm_v2_presence_client

  windows-regression-contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify v1.15 and clean-checkout regression contracts
        run: >-
          python lab/scripts/run_panel_tests.py
          test_cloud_mapper
          test_v1_1_5_tabs_closed
          test_estelam_hamta
          test_robot_interpreter
          test_server_crm_v2_release_gate

  host-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: irica_ci_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IRICA_DB_ROOT_PASSWORD: irica_ci_root
      IRICA_DB_HOST: 127.0.0.1
      IRICA_DB_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MariaDB client and PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql php-mbstring
          echo "IRICA_MARIADB=$(command -v mariadb)" >> "$GITHUB_ENV"
          echo "IRICA_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Verify v2 schema, auth, finance, migration and database resilience on real MariaDB
        run: >-
          python lab/scripts/run_panel_tests.py
          test_server_crm_v2_schema
          test_server_crm_v2_device_auth
          test_server_crm_v2_finance
          test_server_crm_v2_finance_void
          test_server_crm_v2_finance_transport
          test_server_crm_v2_legacy_import
          test_server_crm_v2_legacy_apply
          test_server_crm_v2_legacy_page
          test_server_crm_v2_database_resilience
          test_server_crm_v2_backup_restore
          test_server_crm_v2_presence
          test_v115_audit_config_switch
      - name: Lint host PHP and migration page JavaScript
        run: |
          find host -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check host/public/legacy-import.js

  mysql57-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: irica_mysql57_root
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pirica_mysql57_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      IRICA_DB_ROOT_PASSWORD: irica_mysql57_root
      IRICA_DB_HOST: 127.0.0.1
      IRICA_DB_PORT: '3308'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatibility clients
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql php-mbstring
          echo "IRICA_MARIADB=$(command -v mariadb)" >> "$GITHUB_ENV"
          echo "IRICA_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Exercise v1.15 transactional paths on MySQL 5.7
        run: >-
          python lab/scripts/run_panel_tests.py
          test_server_crm_v2_schema
          test_server_crm_v2_device_auth
          test_server_crm_v2_finance
          test_server_crm_v2_finance_void
          test_server_crm_v2_legacy_import
          test_server_crm_v2_legacy_apply
          test_server_crm_v2_database_resilience
          test_server_crm_v2_backup_restore
          test_server_crm_v2_presence
