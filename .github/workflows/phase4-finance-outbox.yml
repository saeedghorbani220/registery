name: phase4-finance-outbox

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase4-finance-outbox.yml'
      - 'lab/scripts/patch_phase4_finance_outbox.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Apply guarded outbox patch
        run: python lab/scripts/patch_phase4_finance_outbox.py
      - name: Verify finance routing and transport regressions
        run: >-
          python lab/scripts/run_panel_tests.py
          test_server_crm_v2_finance_outbox
          test_cloud_transport
          test_server_crm_v2_authority
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_sync/outbox.py panel.py lab/tests/test_server_crm_v2_finance_outbox.py
          git diff --cached --check
          git commit -m "feat(finance): route ledger creates through durable outbox"
          git push origin HEAD:feat/server-crm-v2-work
