name: phase9-release-docs

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase9-release-docs.yml'
      - 'lab/scripts/patch_phase9_release_docs.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v1.15.0 release documentation patch
        run: python lab/scripts/patch_phase9_release_docs.py
      - name: Verify release metadata and rollout runbook
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          assert (root / 'VERSION').read_text(encoding='utf-8').strip() == '1.15.0'
          changelog = (root / 'CHANGELOG.md').read_text(encoding='utf-8')
          notes = (root / 'RELEASE_NOTES_v1.15.0.md').read_text(encoding='utf-8')
          install = (root / 'host' / 'INSTALL.md').read_text(encoding='utf-8')
          assert '## [1.15.0] - 2026-10-15' in changelog
          assert 'CRM Migration Center for v1.13.1 and older stores' in changelog
          assert 'fully restorable' in changelog
          assert 'v1.15.0' in notes
          assert 'Local CRM mode remains available' in notes
          assert '004_legacy_import_verification.sql' in install
          assert 'five `bin/` scripts' in install
          assert 'every live base table' in install
          assert 'database triggers' in install
          assert 'complete second database' in install
          assert 'compare the source/restored base-table and trigger counts' in install
          assert '001_initial.sql, 002_server_crm_v2_foundation.sql, 003_server_crm_v2_device_auth.sql' not in install
          PY
          git diff --check
      - name: Commit verified v1.15.0 release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md RELEASE_NOTES_v1.15.0.md host/INSTALL.md
          git diff --cached --check
          git commit -m "docs(release): prepare v1.15.0 rollout"
          git push origin HEAD:feat/server-crm-v2-work
