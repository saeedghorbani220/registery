name: phase5-legacy-apply-guard

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase5-legacy-apply-guard.yml'
      - 'lab/scripts/patch_phase5_legacy_apply_guard.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: irica_ci_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IRICA_DB_ROOT_PASSWORD: irica_ci_root
      IRICA_DB_HOST: 127.0.0.1
      IRICA_DB_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql
          echo "IRICA_MARIADB=$(command -v mariadb)" >> "$GITHUB_ENV"
          echo "IRICA_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Apply guarded reject-reference patch
        run: python lab/scripts/patch_phase5_legacy_apply_guard.py
      - name: Verify legacy analyze/apply on real MariaDB
        run: >-
          python lab/scripts/run_panel_tests.py
          test_server_crm_v2_legacy_import
          test_server_crm_v2_legacy_apply
      - name: Lint migration services
        run: |
          php -l host/src/LegacyImport.php
          php -l host/src/LegacyApply.php
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/src/LegacyApply.php lab/tests/test_server_crm_v2_legacy_apply.py
          git diff --cached --check
          git commit -m "fix(migration): block references to rejected legacy parents"
          git push origin HEAD:feat/server-crm-v2-work
