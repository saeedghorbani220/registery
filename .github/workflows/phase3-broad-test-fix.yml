name: phase3-broad-test-fix

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase3-broad-test-fix.yml'
      - 'lab/scripts/patch_phase3_broad_test_contracts.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Apply guarded test contract updates
        run: python lab/scripts/patch_phase3_broad_test_contracts.py
      - name: Verify affected suites
        run: >-
          python lab/scripts/run_panel_tests.py
          test_cloud_conflicts
          test_cloud_integration
          test_cloud_transport
          test_server_crm_v2_authority
      - name: Commit verified test updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/tests/test_cloud_conflicts.py lab/tests/test_cloud_integration.py
          git diff --cached --check
          git commit -m "test(sync): align broad fixtures with durable bootstrap"
          git push origin HEAD:feat/server-crm-v2-work
