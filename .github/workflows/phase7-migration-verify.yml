name: phase7-migration-verify

on:
  push:
    branches:
      - 'feat/server-crm-v2-work'
    paths:
      - '.github/workflows/phase7-migration-verify.yml'
      - 'lab/scripts/patch_phase7_migration_verify.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IRICA_DB_ROOT_PASSWORD: ci-${{ github.run_id }}
      IRICA_DB_HOST: 127.0.0.1
      IRICA_DB_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-crm-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql php-mbstring
          echo "IRICA_MARIADB=$(command -v mariadb)" >> "$GITHUB_ENV"
          echo "IRICA_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Apply Phase 7 verification patch
        run: python lab/scripts/patch_phase7_migration_verify.py
      - name: Verify apply and reconciliation on real MariaDB
        run: python lab/scripts/run_panel_tests.py test_server_crm_v2_legacy_apply
      - name: Lint host PHP
        run: |
          php -l host/src/LegacyVerify.php
          php -l host/src/LegacyApply.php
          php -l host/public/index.php
      - name: Commit and safely rebase verified production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/migrations/004_legacy_import_verification.sql host/src/LegacyVerify.php host/src/LegacyApply.php host/public/index.php lab/tests/test_server_crm_v2_legacy_apply.py
          git diff --cached --check
          git commit -m "feat(migration): add transactional reconciliation report"
          git fetch origin feat/server-crm-v2-work
          git rebase origin/feat/server-crm-v2-work
          git push origin HEAD:feat/server-crm-v2-work
